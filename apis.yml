name: RedNote (Xiaohongshu)
description: 'RedNote, known in China as Xiaohongshu (小红书, "Little Red Book"), is a
  Shanghai-based social and e-commerce platform operated by Xingyin Information Technology
  (行吟信息科技). It blends user-generated lifestyle content, community discovery, and
  in-app shopping, and is one of China''s largest content-commerce platforms. Beyond
  the consumer app, RedNote runs an open platform (open.xiaohongshu.com) plus the
  Qianfan (千帆) merchant commerce workbench (ark.xiaohongshu.com) and a mini-program
  surface (miniapp.xiaohongshu.com) that let brands, merchants, and marketing partners
  integrate storefronts, content, and campaigns. It was surfaced as a portfolio company
  of HongShan (Sequoia China) and added to the API Evangelist network for enrichment.'
